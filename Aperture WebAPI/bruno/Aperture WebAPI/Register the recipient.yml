info:
  name: Register the recipient
  type: http
  seq: 2

http:
  method: POST
  url: "{{base}}/api/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "firstName": "Bob", "lastName": "Recipient", "username": "{{recipient}}", "password": "{{password}}" }'

runtime:
  scripts:
    - type: after-response
      code: test("status is 200 or 409", () => expect(res.getStatus()).to.be.oneOf([200, 409]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates the recipient account. 409 if it already exists.
