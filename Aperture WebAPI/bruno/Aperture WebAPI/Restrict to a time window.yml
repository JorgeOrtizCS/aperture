info:
  name: Restrict to a time window
  type: http
  seq: 8

http:
  method: POST
  url: "{{base}}/api/situational/content/{{contentId}}/time"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "startTime": "12:00", "expiresAt": "14:00" }'
  auth:
    type: bearer
    token: "{{senderToken}}"

runtime:
  variables:
    - name: contentId
      value: "18"
    - name: windowStart
      value: 12:00
  scripts:
    - type: before-request
      code: |-
        // Log in first so this request works on its own: tokens live only in the
        // API's memory and stop working when it restarts.
        const login = await bru.sendRequest({
          method: "POST",
          url: bru.interpolate("{{base}}/api/auth/login"),
          headers: { "Content-Type": "application/json" },
          data: {
            username: bru.interpolate("{{sender}}"),
            password: bru.interpolate("{{password}}")
          }
        });
        bru.setVar("senderToken", login.data.Token);
        // A window around "now" (UTC) so the viewing requests that follow are still allowed:
        // opened 5 minutes ago, closes in 60 minutes.
        const now = Date.now();
        bru.setVar("windowStart", new Date(now - 5 * 60 * 1000).toISOString());
        bru.setVar("windowEnd", new Date(now + 60 * 60 * 1000).toISOString());
    - type: after-response
      code: test("status is 200", () => expect(res.getStatus()).to.be.oneOf([200]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Situational Awareness: replaces the content's start time and expiration (UTC). Null in either field removes that limit."
