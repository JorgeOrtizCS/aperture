info:
  name: Register the sender
  type: http
  seq: 1

http:
  method: POST
  url: "{{base}}/api/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "firstName": "Alice", "lastName": "Sender", "username": "{{sender}}", "password": "{{password}}" }'

runtime:
  scripts:
    - type: after-response
      code: test("status is 200 or 409", () => expect(res.getStatus()).to.be.oneOf([200, 409]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates the sender account. 409 if it already exists, which is fine on reruns.
